name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate migrations
        run: pnpm db:generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit & integration tests
        run: pnpm test

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Build app
        run: pnpm build
        env:
          DATABASE_URL: ./data/ci.db
          SESSION_SECRET: ci-dummy-secret-32-bytes-of-padding
          APP_URL: http://localhost:3100

      - name: E2E tests
        run: pnpm test:e2e
        env:
          DATABASE_URL: ./data/e2e.db
          SESSION_SECRET: ci-dummy-secret-32-bytes-of-padding
          APP_URL: http://localhost:3100

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate migrations
        run: pnpm db:generate

      - name: Verify Cloudflare auth
        run: pnpm exec wrangler whoami
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Build worker
        run: pnpm cf:build

      - name: Deploy
        id: deploy
        run: |
          set -o pipefail
          pnpm exec opennextjs-cloudflare upload 2>&1 | tee /tmp/deploy.log
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Publish deploy log to public paste on failure
        if: failure()
        run: |
          echo "=== last 80 lines ==="
          tail -80 /tmp/deploy.log
          URL=$(curl -sS --data-binary @/tmp/deploy.log https://0x0.st)
          echo "::error::Deploy log: $URL"
          echo "DEPLOY_LOG_URL=$URL"
