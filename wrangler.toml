name = "bolao-copa-do-mundo"
compatibility_date = "2026-04-01"
compatibility_flags = ["nodejs_compat"]
main = ".open-next/worker.js"

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "bolao-prod"
database_id = "7b6c4122-d9d5-4269-9773-d13b4ee5dd63"
migrations_dir = "drizzle"

[[kv_namespaces]]
binding = "NEXT_INC_CACHE_KV"
id = "68c0aba7bcf646f99749d97911a101a4"

[[r2_buckets]]
binding = "FILES"
bucket_name = "bolao-files"

[vars]
APP_URL = "https://bolao-copa-do-mundo.red-frost-400e.workers.dev"
DEFAULT_LOCALE = "pt-BR"
TIMEZONE = "America/Sao_Paulo"

# Secrets — set via `wrangler secret put`:
#   wrangler secret put SESSION_SECRET
#   wrangler secret put RESEND_API_KEY
#   wrangler secret put FOOTBALL_DATA_API_KEY
#   wrangler secret put CRON_SECRET
#   wrangler secret put SUPERADMIN_EMAIL

[triggers]
crons = [
  "*/5 * * * *",   # sync-results during match days
  "0 * * * *",     # reminders (hourly)
  "0 23 * * *",    # daily recap at 23h UTC
]
