# Worker name. Forks should change this to a unique name (it becomes
# part of the workers.dev URL). The CI/CD pipeline reads this to know
# which worker to deploy to.
name = "bolao-copa-do-mundo"
compatibility_date = "2026-04-01"
compatibility_flags = ["nodejs_compat"]
main = ".open-next/worker.js"

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "bolao-prod"
database_id = "7b6c4122-d9d5-4269-9773-d13b4ee5dd63"
migrations_dir = "drizzle"

[[kv_namespaces]]
binding = "NEXT_INC_CACHE_KV"
id = "68c0aba7bcf646f99749d97911a101a4"

[[r2_buckets]]
binding = "FILES"
bucket_name = "bolao-files"

[vars]
DEFAULT_LOCALE = "pt-BR"
TIMEZONE = "America/Sao_Paulo"

# APP_URL is set per-deployment via the Cloudflare dashboard
# (Workers & Pages → your-worker → Settings → Variables and Secrets).
# This keeps the URL out of source control so forks/clones don't have
# to edit this file.

# Secrets — set via `wrangler secret put`:
#   wrangler secret put SESSION_SECRET
#   wrangler secret put RESEND_API_KEY
#   wrangler secret put FOOTBALL_DATA_API_KEY
#   wrangler secret put CRON_SECRET
#   wrangler secret put SUPERADMIN_EMAIL
#   wrangler secret put SUPERADMIN_BOOTSTRAP_PASSWORD  # used only on first login; remove after
#                                                       # changing the password in the UI.

[triggers]
crons = [
  "*/5 * * * *",   # sync-results during match days
  "0 * * * *",     # reminders (hourly)
  "0 23 * * *",    # daily recap at 23h UTC
]
